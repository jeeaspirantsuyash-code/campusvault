<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070d"><title>CampusVault — College Management Suite</title><style>
:root{--bg:#05070d;--panel:#0b101a;--panel2:#101722;--line:#1b2636;--text:#edf6ff;--muted:#8ea0b8;--sky:#38bdf8;--sky2:#0ea5e9;--cyan:#22d3ee;--purple:#8b5cf6;--green:#34d399;--red:#fb7185;--amber:#fbbf24;--shadow:0 18px 60px #0008}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0%,#0c1e33 0,transparent 32%),radial-gradient(circle at 90% 10%,#15102e 0,transparent 28%),var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}.auth:before,.auth:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(70px);opacity:.18}.auth:before{background:var(--sky);left:-160px;top:-160px}.auth:after{background:var(--purple);right:-160px;bottom:-160px}.authcard{position:relative;z-index:1;width:min(470px,100%);background:#0b101af2;border:1px solid #263449;border-radius:28px;padding:34px;box-shadow:var(--shadow);backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:13px}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky),var(--purple));color:#00121d;font-weight:950;box-shadow:0 0 30px #38bdf855}.brand h1{margin:0;font-size:21px}.brand small{display:block;color:var(--muted);margin-top:2px}.auth h2{font-size:30px;margin:30px 0 7px}.muted,.hint{color:var(--muted);font-size:13px}.tabs{display:flex;gap:6px;background:#070b12;border:1px solid var(--line);padding:5px;border-radius:13px;margin:24px 0}.tabs button{flex:1;border:0;padding:11px;border-radius:9px;background:transparent;color:var(--muted)}.tabs .on{background:#162333;color:#fff;box-shadow:0 0 0 1px #29435d}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;color:#b9c8da;margin-bottom:7px}.field input,.field select{width:100%;padding:13px 14px;border:1px solid #253348;border-radius:11px;background:#070c14;color:#fff;outline:none;transition:.2s}.field input:focus,.field select:focus{border-color:var(--sky);box-shadow:0 0 0 3px #38bdf81c}.primary{border:0;background:linear-gradient(135deg,var(--sky),var(--sky2));color:#00121d;border-radius:11px;padding:12px 16px;font-weight:900;box-shadow:0 8px 24px #0ea5e933;transition:.2s}.primary:hover{transform:translateY(-1px);box-shadow:0 12px 30px #0ea5e955}.full{width:100%}.shell{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:260px;background:#070b12eF;border-right:1px solid var(--line);padding:22px 15px;z-index:5;backdrop-filter:blur(18px)}.side .logo{width:45px;height:45px;border-radius:13px}.side .brand{padding:4px 7px 22px}.side .brand b{font-size:17px}.side .brand small{font-size:10px}.section-label{color:#52647b;font-size:10px;font-weight:900;letter-spacing:1.7px;padding:16px 10px 7px}.nav{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:transparent;color:#9badc3;text-align:left;padding:12px 13px;border-radius:12px;margin:4px 0;font-weight:700;transition:.2s}.nav i{font-style:normal;width:22px;text-align:center;color:#71849b}.nav:hover{background:#0e1825;color:#fff;border-color:#1e2d40}.nav.active{background:linear-gradient(90deg,#123047,#0e1a28);color:#fff;border-color:#1e4965;box-shadow:inset 3px 0 var(--sky)}.nav.active i{color:var(--sky)}.main{margin-left:260px;width:calc(100% - 260px)}.top{position:sticky;top:0;z-index:4;background:#070b12eB;border-bottom:1px solid var(--line);padding:15px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px;backdrop-filter:blur(18px)}.top b{font-size:15px}.top-actions{display:flex;align-items:center;gap:9px}.online{display:flex;align-items:center;gap:7px;color:#91a3ba;font-size:11px}.dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green)}.content{padding:28px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.head h1{margin:0 0 6px;font-size:30px}.head p{margin:0}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b2234,#11112c 60%,#18112c);border:1px solid #21415c;border-radius:22px;padding:28px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-120px;background:var(--sky);filter:blur(70px);opacity:.16}.hero h2{margin:0;font-size:27px}.hero p{color:#9db2c8;max-width:650px}.eyebrow{color:var(--sky);font-size:10px;font-weight:900;letter-spacing:1.8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:15px}.card{background:linear-gradient(145deg,#0b111b,#0a0f17);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 40px #0003}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;right:-30px;bottom:-35px;width:110px;height:110px;border-radius:50%;background:var(--sky);filter:blur(45px);opacity:.08}.stat small{color:#7890aa;font-size:10px;font-weight:900;letter-spacing:1.3px}.stat strong{display:block;font-size:30px;margin:9px 0 3px}.stat .trend{font-size:11px;color:#7e93ab}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:15px;margin-top:15px}.card h3{margin:0 0 15px;font-size:16px}.dept{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #172130}.dept:last-child{border-bottom:0}.badge{padding:4px 9px;border-radius:999px;font-size:10px;font-weight:900}.green{background:#063b2d;color:#5ee7b1}.red{background:#401725;color:#ff9aac}.amber{background:#3d2c08;color:#ffd66b}.blue{background:#082e43;color:#66d9ff}.btn{border:1px solid #27364b;background:#0b121c;color:#c8d6e6;border-radius:10px;padding:10px 13px;font-weight:800}.btn:hover{border-color:#3a5874;background:#101a27}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid #172130;font-size:13px}.table th{font-size:10px;color:#667d98;text-transform:uppercase;letter-spacing:.8px}.table tr:hover td{background:#0d1520}.searchbar{display:flex;gap:8px;margin-bottom:15px}.searchbar input{flex:1;padding:12px 13px;border:1px solid #253348;border-radius:11px;background:#070c14;color:#fff;outline:none}.searchbar input:focus{border-color:var(--sky)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20;backdrop-filter:blur(8px)}.modalbox{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0b111b;border:1px solid #26374d;border-radius:20px;box-shadow:var(--shadow)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}.actions{text-align:right;margin-top:18px;display:flex;justify-content:flex-end;gap:8px}.empty{padding:28px;text-align:center;color:var(--muted)}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.profile{display:flex;align-items:center;gap:14px}.avatar{width:55px;height:55px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#163b54,#33205e);color:var(--sky);font-size:20px;font-weight:900}.mini{font-size:11px;color:#6f849c}.accent{color:var(--sky)}@media(max-width:950px){.side{width:72px}.side .brand div:not(.logo),.nav span,.section-label{display:none}.side .brand{justify-content:center;padding:4px 0 22px}.nav{justify-content:center;padding:13px 8px}.main{margin-left:72px;width:calc(100% - 72px)}.grid{grid-template-columns:1fr 1fr}.two,.account-grid{grid-template-columns:1fr}}@media(max-width:600px){.content{padding:15px}.top{padding:13px 15px}.top-actions .online{display:none}.grid,.formgrid{grid-template-columns:1fr}.hero{padding:21px}.head{flex-direction:column}.head h1{font-size:25px}.card{padding:16px}.authcard{padding:24px;border-radius:22px}}
</style></head><body>
<section id="auth" class="auth"><div class="authcard"><div class="brand"><div class="logo">CV</div><div><h1>CampusVault</h1><small>College Management Suite</small></div></div><h2 id="title">Welcome back</h2><p class="muted" id="sub">Securely access your college workspace.</p><div class="tabs"><button id="lt" class="on" onclick="authMode('login')">Login</button><button id="st" onclick="authMode('signup')">Create College</button></div><div id="authform"></div></div></section>
<section id="app" style="display:none"><div class="shell"><aside class="side"><div class="brand"><div class="logo">CV</div><div><b>CampusVault</b><small>Management Suite</small></div></div><div class="section-label">CAMPUS</div><button class="nav active" data-p="dashboard"><i>⌂</i><span>Dashboard</span></button><button class="nav" data-p="students"><i>♙</i><span>Students</span></button><button class="nav" data-p="library"><i>▤</i><span>Library</span></button><button class="nav" data-p="fees"><i>₹</i><span>Fees</span></button><div class="section-label">ACCOUNT</div><button class="nav" data-p="account"><i>◉</i><span>Account</span></button><button class="nav" onclick="logout()"><i>↪</i><span>Logout</span></button></aside><main class="main"><header class="top"><div><b id="college"></b><br><small class="muted" id="who"></small></div><div class="top-actions"><span class="online"><span class="dot"></span>Workspace online</span><button class="btn" onclick="render()">↻ Refresh</button></div></header><div class="content" id="content"></div></main></div></section><div id="modal"></div>
<script>let user=null,page='dashboard';const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const api=async(u,o={})=>{let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.cvToken||'')}}),x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Request failed');return x};function authMode(m){$('lt').classList.toggle('on',m==='login');$('st').classList.toggle('on',m==='signup');$('title').textContent=m==='login'?'Welcome back':'Create your college workspace';$('sub').textContent=m==='login'?'Securely access your college workspace.':'Register your college and start managing students.';$('authform').innerHTML=m==='login'?'<div class=field><label>College ID</label><input id=cid placeholder="Your College ID"></div><div class=field><label>Password</label><input id=pw type=password placeholder="Your password"></div><button class="primary full" onclick="login()">Enter Workspace →</button><p class=hint>Use the College ID created during signup.</p>':'<div class=field><label>Your Name</label><input id=nm placeholder="Full name"></div><div class=field><label>College Name</label><input id=cn placeholder="Enter your college name"></div><div class=field><label>College ID (optional)</label><input id=ncid placeholder="Leave blank to generate"></div><div class=field><label>Password</label><input id=npw type=password placeholder="Minimum 6 characters"></div><button class="primary full" onclick="signup()">Create College Workspace →</button><p class=hint>Your College ID will be displayed after signup.</p>'}async function login(){try{let x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({college_id:cid.value,password:pw.value})});localStorage.cvToken=x.token;user=x.user;enter()}catch(e){alert(e.message)}}async function signup(){try{let x=await api('/api/auth/signup',{method:'POST',body:JSON.stringify({full_name:nm.value,college_name:cn.value,college_id:ncid.value,password:npw.value})});localStorage.cvToken=x.token;user=x.user;alert('College created! Your College ID is: '+x.user.college_login);enter()}catch(e){alert(e.message)}}async function enter(){if(!user)user=await api('/api/me');$('auth').style.display='none';$('app').style.display='block';$('college').textContent=user.college_name;$('who').textContent=user.full_name+' · College ID: '+user.college_login;nav();render()}async function boot(){if(localStorage.cvToken)try{user=await api('/api/me');enter();return}catch(e){localStorage.removeItem('cvToken')}authMode('login')}function nav(){document.querySelectorAll('.nav[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;document.querySelectorAll('.nav[data-p]').forEach(x=>x.classList.toggle('active',x===b));render()})}async function render(){try{if(page==='dashboard')return dashboard();if(page==='students')return students();if(page==='library')return library();if(page==='fees')return fees();account()}catch(e){$('content').innerHTML='<div class=card>'+esc(e.message)+'</div>'}}async function dashboard(){let x=await api('/api/dashboard');$('content').innerHTML='<div class="hero"><div class=eyebrow>CAMPUSVAULT COMMAND CENTER</div><h2>Welcome to '+esc(user.college_name)+'</h2><p>Manage your student directory, library, attendance insights and fee records from one modern college workspace.</p><button class=primary onclick="page=\'students\';render()">+ Add Student</button></div><div class=grid><div class="card stat"><small>STUDENTS</small><strong>'+x.totalStudents+'</strong><span class=trend>Registered in campus database</span></div><div class="card stat"><small>LIBRARY BOOKS</small><strong>'+x.libraryBooks+'</strong><span class=trend>'+x.issuedBooks+' currently issued</span></div><div class="card stat"><small>ATTENDANCE</small><strong>'+x.avgAttendance+'%</strong><span class=trend>'+x.lowAttendanceCount+' low-attendance records</span></div><div class="card stat"><small>FEES PAID</small><strong>₹'+Number(x.feeSummary.paid||0).toLocaleString('en-IN')+'</strong><span class=trend>₹'+Number(x.feeSummary.pending||0).toLocaleString('en-IN')+' pending</span></div></div><div class=two><div class=card><h3>Department Overview</h3>'+(x.departments.map(d=>'<div class=dept><span>'+esc(d.department)+'</span><span class="badge blue">'+d.count+'</span></div>').join('')||'<div class=empty>No students yet.</div>')+'</div><div class=card><h3>Quick Actions</h3><p class=muted>Jump directly into the core college operations.</p><p><button class=btn onclick="page=\'students\';render()">Student Directory</button></p><p><button class=btn onclick="page=\'library\';render()">Library Register</button></p><p><button class=btn onclick="page=\'fees\';render()">Fee Management</button></p></div></div>'}async function students(){let x=await api('/api/students?perPage=100');$('content').innerHTML='<div class=head><div><div class=eyebrow>DIRECTORY</div><h1>Students</h1><p class=muted>Student records for '+esc(user.college_name)+'</p></div><button class=primary onclick="studentForm()">+ Add New Student</button></div><div class=card><div class=searchbar><input id=search placeholder="Search name, roll or enrollment" onkeydown="if(event.key===\'Enter\')searchStudents()"><button class=btn onclick="searchStudents()">Search</button></div><div id=studentTable class=table>'+studentRows(x.rows)+'</div></div>'}function studentRows(a){return '<table><thead><tr><th>Name</th><th>Roll</th><th>Enrollment</th><th>Department</th><th>Year</th><th>CGPA</th><th>Attendance</th></tr></thead><tbody>'+(a.map(s=>'<tr><td><b>'+esc(s.full_name)+'</b><br><small class=mini>'+esc(s.email)+'</small></td><td>'+esc(s.roll_no)+'</td><td>'+esc(s.enrollment_id)+'</td><td>'+esc(s.department)+'</td><td>'+s.year+' / '+esc(s.section)+'</td><td>'+s.cgpa+'</td><td><span class="badge '+(s.attendance<65?'red':'green')+'">'+s.attendance+'%</span></td></tr>').join('')||'<tr><td colspan=7 class=empty>No students found.</td></tr>')+'</tbody></table>'}async function searchStudents(){let x=await api('/api/students?perPage=100&search='+encodeURIComponent($('search').value));$('studentTable').innerHTML=studentRows(x.rows)}function studentForm(){$('modal').innerHTML='<div class=modal><div class="modalbox card"><h2>Add New Student</h2><p class=muted>Enter the student information below.</p><div class=formgrid>'+[['fname','Full Name','Student full name'],['email','Email','student@example.com'],['roll','Roll Number','Roll number'],['enroll','Enrollment ID','University/enrollment ID'],['dept','Department',''],['program','Program','B.Tech / BCA / MBA'],['year','Year',''],['section','Section','A'],['cgpa','CGPA','0'],['att','Attendance %','0']].map(([id,l,p])=>'<div class=field><label>'+l+'</label>'+(['dept','year'].includes(id)?'<select id='+id+'></select>':'<input id='+id+' placeholder="'+p+'">')+'</div>').join('')+'</div><div class=actions><button class=btn onclick="closeModal()">Cancel</button><button class=primary onclick="saveStudent()">Save Student</button></div></div></div>';api('/api/departments').then(d=>{$('dept').innerHTML=d.map(x=>'<option>'+esc(x.name)+'</option>').join('');$('year').innerHTML='<option>1</option><option>2</option><option>3</option><option>4</option>'})}async function saveStudent(){try{await api('/api/students',{method:'POST',body:JSON.stringify({full_name:fname.value,email:email.value,roll_no:roll.value,enrollment_id:enroll.value,department:dept.value,program:program.value,year:year.value,section:section.value,cgpa:cgpa.value,attendance:att.value})});closeModal();students()}catch(e){alert(e.message)}}async function library(){let [b,i]=await Promise.all([api('/api/books'),api('/api/issues')]);$('content').innerHTML='<div class=head><div><div class=eyebrow>KNOWLEDGE HUB</div><h1>Library</h1><p class=muted>Books and issue/return register.</p></div></div><div class=grid><div class="card stat"><small>TITLES</small><strong>'+b.length+'</strong><span class=trend>Unique catalogue titles</span></div><div class="card stat"><small>COPIES</small><strong>'+b.reduce((a,x)=>a+x.total_copies,0)+'</strong><span class=trend>Total physical copies</span></div><div class="card stat"><small>AVAILABLE</small><strong>'+b.reduce((a,x)=>a+x.available_copies,0)+'</strong><span class=trend>Ready for issue</span></div><div class="card stat"><small>ISSUED</small><strong>'+i.filter(x=>x.status==='Issued').length+'</strong><span class=trend>Active issue records</span></div></div><div class=two><div class=card><h3>Book Catalogue</h3><div class=table><table><tr><th>Book</th><th>Author</th><th>Copies</th></tr>'+b.map(x=>'<tr><td><b>'+esc(x.title)+'</b><br><small class=mini>'+x.book_code+'</small></td><td>'+esc(x.author)+'</td><td><span class="badge blue">'+x.available_copies+'/'+x.total_copies+'</span></td></tr>').join('')+'</table></div></div><div class=card><h3>Issue Register</h3><div class=table><table><tr><th>Student</th><th>Book</th><th>Status</th></tr>'+i.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+esc(x.title)+'</td><td><span class="badge '+(x.status==='Issued'?'amber':'green')+'">'+x.status+'</span></td></tr>').join('')+'</table></div></div></div>'}async function fees(){let [c,s,p]=await Promise.all([api('/api/fees/chart'),api('/api/fees/summary'),api('/api/fees/payments')]);$('content').innerHTML='<div class=head><div><div class=eyebrow>FINANCE</div><h1>Fee Management</h1><p class=muted>Fee chart and student-wise payment ledger.</p></div></div><div class=grid><div class="card stat"><small>DUE</small><strong>₹'+Number(s.due||0).toLocaleString('en-IN')+'</strong><span class=trend>Configured fee amount</span></div><div class="card stat"><small>PAID</small><strong>₹'+Number(s.paid||0).toLocaleString('en-IN')+'</strong><span class=trend>Recorded payments</span></div><div class="card stat"><small>PENDING</small><strong>₹'+Number(s.pending||0).toLocaleString('en-IN')+'</strong><span class=trend>Outstanding amount</span></div><div class="card stat"><small>ENTRIES</small><strong>'+s.payments+'</strong><span class=trend>Payment records</span></div></div><div class="card" style="margin-top:15px"><h3>College Fee Chart</h3><p class=muted>Fee structures are college-specific. Verify official amounts before use.</p><div class=table><table><tr><th>Session</th><th>Category</th><th>Fee</th><th>Amount</th></tr>'+c.map(x=>'<tr><td>'+x.session+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.fee_name)+'</td><td><b>₹'+Number(x.amount).toLocaleString('en-IN')+'</b></td></tr>').join('')+'</table></div></div><div class="card" style="margin-top:15px"><h3>Payment Ledger</h3><div class=table><table><tr><th>Student</th><th>Fee</th><th>Paid</th><th>Status</th></tr>'+p.map(x=>'<tr><td>'+esc(x.full_name)+'<br><small class=mini>'+x.roll_no+'</small></td><td>'+esc(x.fee_name)+'</td><td>₹'+Number(x.amount_paid).toLocaleString('en-IN')+'</td><td><span class="badge '+(x.status==='Paid'?'green':'amber')+'">'+x.status+'</span></td></tr>').join('')+'</table></div></div>'}function account(){let initials=String(user.full_name||'U').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();$('content').innerHTML='<div class=head><div><div class=eyebrow>WORKSPACE</div><h1>College Account</h1><p class=muted>Workspace identity and account details.</p></div></div><div class=account-grid><div class=card><div class=profile><div class=avatar>'+esc(initials)+'</div><div><h3 style="margin:0">'+esc(user.full_name)+'</h3><div class=mini>College administrator</div></div></div><hr style="border:0;border-top:1px solid #172130;margin:20px 0"><p><span class=mini>COLLEGE</span><br><b>'+esc(user.college_name)+'</b></p><p><span class=mini>COLLEGE ID</span><br><b class=accent>'+esc(user.college_login)+'</b></p></div><div class=card><h3>CampusVault Workspace</h3><p class=muted>Each registered college has its own workspace and student data.</p><div class="dept"><span>Student directory</span><span class="badge green">Active</span></div><div class="dept"><span>Library records</span><span class="badge green">Active</span></div><div class="dept"><span>Fee records</span><span class="badge green">Active</span></div><div class="dept"><span>Session</span><span class="badge blue">Secure</span></div></div></div>'}function closeModal(){$('modal').innerHTML=''}async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('cvToken');location.reload()}boot();</script></body></html>
