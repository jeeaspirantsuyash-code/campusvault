<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusVault</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}*{box-sizing:border-box}button,input,select{font:inherit}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e8f0ff,#f7f3ff)}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:0 10px 35px #17203312}.authcard{width:min(450px,100%);padding:32px}.logo{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:900}.brand{display:flex;align-items:center;gap:12px}.brand h1{margin:0}.brand small{color:#718096}.tabs{display:flex;gap:5px;background:#f1f4f8;padding:4px;border-radius:10px;margin:22px 0}.tabs button{flex:1;border:0;padding:10px;border-radius:8px;background:none}.tabs .on{background:#fff;font-weight:800;box-shadow:0 2px 7px #0001}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d9e1eb;border-radius:9px}.primary{border:0;background:#2563eb;color:#fff;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.full{width:100%}.hint,.muted{color:#718096;font-size:12px}.shell{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:245px;background:#101827;color:#fff;padding:20px 14px}.side .logo{background:#fff;color:#2563eb}.nav{display:block;width:100%;border:0;background:none;color:#b9c5d5;text-align:left;padding:12px;border-radius:9px;margin:3px 0;cursor:pointer}.nav:hover,.nav.active{background:#20304a;color:#fff}.main{margin-left:245px;width:calc(100% - 245px)}.top{background:#fff;border-bottom:1px solid #e3e8ef;padding:17px 26px;display:flex;justify-content:space-between;gap:12px}.content{padding:25px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}.head h1{margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat strong{display:block;font-size:28px;margin:7px 0}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}.btn{border:1px solid #dce3eb;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4;font-size:13px}.table th{font-size:10px;color:#718096;text-transform:uppercase}.pill{padding:4px 8px;border-radius:99px;font-size:10px;font-weight:800;background:#eaf2ff}.green{background:#e7f8ee;color:#167044}.red{background:#fdecec;color:#a52b2b}.amber{background:#fff4d8;color:#805600}.modal{position:fixed;inset:0;background:#07101c99;display:grid;place-items:center;padding:18px;z-index:10}.modalbox{width:min(680px,100%);max-height:92vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{text-align:right;margin-top:15px}@media(max-width:850px){.side{width:68px}.side .brand div:not(.logo),.nav span{display:none}.main{margin-left:68px;width:calc(100% - 68px)}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:550px){.grid,.formgrid{grid-template-columns:1fr}.content{padding:14px}}</style></head><body><section id="auth" class="auth"><div class="card authcard"><div class="brand"><div class="logo">CV</div><div><h1>CampusVault</h1><small>Smart College Management</small></div></div><h2 id="title">Welcome back</h2><p class="muted" id="sub">Login to your college workspace.</p><div class="tabs"><button id="lt" class="on" onclick="authMode('login')">Login</button><button id="st" onclick="authMode('signup')">Create College</button></div><div id="authform"></div></div></section><section id="app" style="display:none"><div class="shell"><aside class="side"><div class="brand"><div class="logo">CV</div><div><b>CampusVault</b><small>Management Suite</small></div></div><p style="color:#7f8da4;font-size:10px;letter-spacing:1px">CAMPUS</p><button class="nav active" data-p="dashboard">▦ <span>Dashboard</span></button><button class="nav" data-p="students">♙ <span>Students</span></button><button class="nav" data-p="library">▤ <span>Library</span></button><button class="nav" data-p="fees">₹ <span>Fees</span></button><p style="color:#7f8da4;font-size:10px;letter-spacing:1px">ACCOUNT</p><button class="nav" data-p="account">◈ <span>Account</span></button><button class="nav" onclick="logout()">↪ <span>Logout</span></button></aside><main class="main"><header class="top"><div><b id="college"></b><br><small class="muted" id="who"></small></div><button class="btn" onclick="render()">Refresh</button></header><div class="content" id="content"></div></main></div></section><div id="modal"></div><script>let user=null,page='dashboard';const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const api=async(u,o={})=>{let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.cvToken||'')}}),x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Request failed');return x};function authMode(m){$('lt').classList.toggle('on',m==='login');$('st').classList.toggle('on',m==='signup');$('title').textContent=m==='login'?'Welcome back':'Create your college workspace';$('sub').textContent=m==='login'?'Login to your college workspace.':'Register your college and start managing students.';$('authform').innerHTML=m==='login'?'<div class=field><label>College ID</label><input id=cid placeholder="Your College ID"></div><div class=field><label>Password</label><input id=pw type=password></div><button class="primary full" onclick="login()">Login</button><p class=hint>Already registered? Use the College ID created during signup.</p>':'<div class=field><label>Your Name</label><input id=nm placeholder="Full name"></div><div class=field><label>College Name</label><input id=cn placeholder="Enter your college name"></div><div class=field><label>College ID (optional)</label><input id=ncid placeholder="Leave blank to generate"></div><div class=field><label>Password</label><input id=npw type=password placeholder="Minimum 6 characters"></div><button class="primary full" onclick="signup()">Create College Workspace</button><p class=hint>Your College ID will be displayed after signup.</p>'}async function login(){try{let x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({college_id:cid.value,password:pw.value})});localStorage.cvToken=x.token;user=x.user;enter()}catch(e){alert(e.message)}}async function signup(){try{let x=await api('/api/auth/signup',{method:'POST',body:JSON.stringify({full_name:nm.value,college_name:cn.value,college_id:ncid.value,password:npw.value})});localStorage.cvToken=x.token;user=x.user;alert('College created! Your College ID is: '+x.user.college_login);enter()}catch(e){alert(e.message)}}async function enter(){if(!user)user=await api('/api/me');$('auth').style.display='none';$('app').style.display='block';$('college').textContent=user.college_name;$('who').textContent=user.full_name+' · College ID: '+user.college_login;nav();render()}async function boot(){if(localStorage.cvToken)try{user=await api('/api/me');enter();return}catch(e){localStorage.removeItem('cvToken')}authMode('login')}function nav(){document.querySelectorAll('.nav[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));render()})}async function render(){try{if(page==='dashboard')return dashboard();if(page==='students')return students();if(page==='library')return library();if(page==='fees')return fees();account()}catch(e){$('content').innerHTML='<div class=card>'+esc(e.message)+'</div>'}}async function dashboard(){let x=await api('/api/dashboard');$('content').innerHTML='<div class=card style="background:linear-gradient(135deg,#172554,#4c1d95);color:white"><h2>Welcome to '+esc(user.college_name)+'</h2><p>Your personalized CampusVault workspace.</p></div><div class=grid style="margin-top:14px"><div class="card stat"><small>STUDENTS</small><strong>'+x.totalStudents+'</strong><span class=muted>Registered</span></div><div class="card stat"><small>LIBRARY BOOKS</small><strong>'+x.libraryBooks+'</strong><span class=muted>'+x.issuedBooks+' issued</span></div><div class="card stat"><small>ATTENDANCE</small><strong>'+x.avgAttendance+'%</strong><span class=muted>'+x.lowAttendanceCount+' low</span></div><div class="card stat"><small>FEES PAID</small><strong>₹'+Number(x.feeSummary.paid||0).toLocaleString('en-IN')+'</strong><span class=muted>₹'+Number(x.feeSummary.pending||0).toLocaleString('en-IN')+' pending</span></div></div><div class=two><div class=card><h3>Departments</h3>'+(x.departments.map(d=>'<p><b>'+esc(d.department)+'</b><span style="float:right">'+d.count+'</span></p>').join('')||'<p class=muted>No students yet.</p>')+'</div><div class=card><h3>Quick action</h3><p class=muted>Add your students to start building your college database.</p><button class="primary" onclick="page=\'students\';render()">+ Add Student</button></div></div>'}async function students(){let x=await api('/api/students?perPage=100');$('content').innerHTML='<div class=head><div><h1>Students</h1><p class=muted>Student records for '+esc(user.college_name)+'</p></div><button class="primary" onclick="studentForm()">+ Add New Student</button></div><div class=card><div style="display:flex;gap:8px;margin-bottom:14px"><input id=search placeholder="Search student, roll or enrollment" style="flex:1;padding:10px;border:1px solid #d9e1eb;border-radius:9px"><button class=btn onclick="searchStudents()">Search</button></div><div id=studentTable class=table>'+studentRows(x.rows)+'</div></div>'}function studentRows(a){return '<table><thead><tr><th>Name</th><th>Roll</th><th>Enrollment</th><th>Department</th><th>Year</th><th>CGPA</th><th>Attendance</th></tr></thead><tbody>'+(a.map(s=>'<tr><td><b>'+esc(s.full_name)+'</b><br><small class=muted>'+esc(s.email)+'</small></td><td>'+esc(s.roll_no)+'</td><td>'+esc(s.enrollment_id)+'</td><td>'+esc(s.department)+'</td><td>'+s.year+' / '+esc(s.section)+'</td><td>'+s.cgpa+'</td><td><span class="pill '+(s.attendance<65?'red':'green')+'">'+s.attendance+'%</span></td></tr>').join('')||'<tr><td colspan=7 class=muted>No students found.</td></tr>')+'</tbody></table>'}async function searchStudents(){let x=await api('/api/students?perPage=100&search='+encodeURIComponent($('search').value));$('studentTable').innerHTML=studentRows(x.rows)}function studentForm(){$('modal').innerHTML='<div class=modal><div class="card modalbox"><h2>Add New Student</h2><p class=muted>Fill the student information below.</p><div class=formgrid>'+[['fname','Full Name','Student full name'],['email','Email','student@example.com'],['roll','Roll Number','Roll number'],['enroll','Enrollment ID','University/enrollment ID'],['dept','Department',''],['program','Program','B.Tech / BCA / MBA'],['year','Year',''],['section','Section','A'],['cgpa','CGPA','0'],['att','Attendance %','0']].map(([id,l,p])=>'<div class=field><label>'+l+'</label>'+(['dept','year'].includes(id)?'<select id='+id+'></select>':'<input id='+id+' placeholder="'+p+'">')+'</div>').join('')+'</div><div class=actions><button class=btn onclick="closeModal()">Cancel</button> <button class=primary onclick="saveStudent()">Save Student</button></div></div></div>';api('/api/departments').then(d=>{$('dept').innerHTML=d.map(x=>'<option>'+esc(x.name)+'</option>').join('');$('year').innerHTML='<option>1</option><option>2</option><option>3</option><option>4</option>'})}async function saveStudent(){try{await api('/api/students',{method:'POST',body:JSON.stringify({full_name:fname.value,email:email.value,roll_no:roll.value,enrollment_id:enroll.value,department:dept.value,program:program.value,year:year.value,section:section.value,cgpa:cgpa.value,attendance:att.value})});closeModal();students()}catch(e){alert(e.message)}}async function library(){let [b,i]=await Promise.all([api('/api/books'),api('/api/issues')]);$('content').innerHTML='<div class=head><div><h1>Library</h1><p class=muted>Books and issue/return register.</p></div></div><div class=grid><div class="card stat"><small>TITLES</small><strong>'+b.length+'</strong></div><div class="card stat"><small>COPIES</small><strong>'+b.reduce((a,x)=>a+x.total_copies,0)+'</strong></div><div class="card stat"><small>AVAILABLE</small><strong>'+b.reduce((a,x)=>a+x.available_copies,0)+'</strong></div><div class="card stat"><small>ISSUED</small><strong>'+i.filter(x=>x.status==='Issued').length+'</strong></div></div><div class=two><div class=card><h3>Book Catalogue</h3><div class=table><table><tr><th>Book</th><th>Author</th><th>Copies</th></tr>'+b.map(x=>'<tr><td><b>'+esc(x.title)+'</b><br><small class=muted>'+x.book_code+'</small></td><td>'+esc(x.author)+'</td><td>'+x.available_copies+'/'+x.total_copies+'</td></tr>').join('')+'</table></div></div><div class=card><h3>Issue Register</h3><div class=table><table><tr><th>Student</th><th>Book</th><th>Status</th></tr>'+i.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+esc(x.title)+'</td><td>'+x.status+'</td></tr>').join('')+'</table></div></div></div>'}async function fees(){let [c,s,p]=await Promise.all([api('/api/fees/chart'),api('/api/fees/summary'),api('/api/fees/payments')]);$('content').innerHTML='<div class=head><div><h1>Fee Management</h1><p class=muted>Fee chart and student-wise payment ledger.</p></div></div><div class=grid><div class="card stat"><small>DUE</small><strong>₹'+Number(s.due||0).toLocaleString('en-IN')+'</strong></div><div class="card stat"><small>PAID</small><strong>₹'+Number(s.paid||0).toLocaleString('en-IN')+'</strong></div><div class="card stat"><small>PENDING</small><strong>₹'+Number(s.pending||0).toLocaleString('en-IN')+'</strong></div><div class="card stat"><small>ENTRIES</small><strong>'+s.payments+'</strong></div></div><div class=card style="margin-top:14px"><h3>College Fee Chart</h3><p class=muted>Fee structures are college-specific. Configure verified amounts before official use.</p><div class=table><table><tr><th>Session</th><th>Category</th><th>Fee</th><th>Amount</th></tr>'+c.map(x=>'<tr><td>'+x.session+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.fee_name)+'</td><td>₹'+Number(x.amount).toLocaleString('en-IN')+'</td></tr>').join('')+'</table></div></div><div class=card style="margin-top:14px"><h3>Payment Ledger</h3><div class=table><table><tr><th>Student</th><th>Fee</th><th>Paid</th><th>Status</th></tr>'+p.map(x=>'<tr><td>'+esc(x.full_name)+'<br><small class=muted>'+x.roll_no+'</small></td><td>'+esc(x.fee_name)+'</td><td>₹'+Number(x.amount_paid).toLocaleString('en-IN')+'</td><td>'+x.status+'</td></tr>').join('')+'</table></div></div>'}function account(){$('content').innerHTML='<div class=card><h2>College Account</h2><p><b>College:</b> '+esc(user.college_name)+'</p><p><b>College ID:</b> '+esc(user.college_login)+'</p><p><b>User:</b> '+esc(user.full_name)+'</p><p class=muted>Each registered college has its own workspace and student data.</p></div>'}function closeModal(){$('modal').innerHTML=''}async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('cvToken');location.reload()}boot();</script></body></html>
