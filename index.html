<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusVault · AITH Kanpur</title><style>
:root{--nav:#102a43;--ink:#172b4d;--muted:#6b7c93;--bg:#f4f7fb;--card:#fff;--line:#dfe7ef;--blue:#1769aa;--green:#198754;--red:#c92a2a;--amber:#b7791f}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.shell{display:flex;min-height:100vh}.side{width:245px;background:var(--nav);color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{display:flex;gap:10px;align-items:center;padding:6px 10px 24px}.logo{width:42px;height:42px;border-radius:10px;background:#fff;color:var(--nav);display:grid;place-items:center;font-weight:800}.brand b{display:block}.brand small{opacity:.7}.label{font-size:11px;opacity:.55;margin:18px 10px 8px;letter-spacing:1px}.nav{width:100%;border:0;background:transparent;color:#dbe8f5;text-align:left;padding:12px 13px;border-radius:8px;margin:2px 0;cursor:pointer}.nav:hover,.nav.active{background:#1d4f7a;color:#fff}.main{margin-left:245px;width:calc(100% - 245px)}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;justify-content:space-between;gap:20px;align-items:center}.top h2{margin:0;font-size:18px}.top small{color:var(--muted)}.content{padding:26px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.head h1{margin:0 0 5px;font-size:27px}.head p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:15px;margin-top:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 8px #102a4308}.stat small{color:var(--muted);font-weight:700;font-size:11px}.stat strong{font-size:28px;display:block;margin-top:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.red{color:#fff;background:var(--red);border-color:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.pill.green{background:#e8f7ef;color:#18794e}.pill.red{background:#fdecec;color:#b42318}.pill.amber{background:#fff5db;color:#8a5a00}.pill.blue{background:#e7f1fb;color:#155b91}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}.filters input,.filters select,.form input,.form select{border:1px solid var(--line);border-radius:7px;padding:9px;background:#fff;min-width:150px}.filters input{flex:1;min-width:240px}.notice{background:#fff8e6;border:1px solid #f0d99a;color:#70530a;padding:12px;border-radius:8px;margin-bottom:15px;font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.section-title h3{margin:0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label{font-size:11px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}.form .full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:#fff;border-radius:12px;width:min(650px,100%);padding:22px;max-height:90vh;overflow:auto}.receipt{max-width:720px;margin:auto}.receipt h1{text-align:center}.receipt .rline{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:8px 0}.muted{color:var(--muted)}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:900px){.side{width:72px}.brand div:not(.logo),.side .label,.nav span.txt{display:none}.main{margin-left:72px;width:calc(100% - 72px)}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.content{padding:16px}}@media(max-width:600px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.top{padding:13px 15px}.content{padding:12px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="logo">CV</div><div><b>CampusVault</b><small>AITH Kanpur ERP</small></div></div><div class="label">ACADEMIC</div><button class="nav active" data-page="dashboard">▦ <span class="txt">Dashboard</span></button><button class="nav" data-page="students">♙ <span class="txt">Students</span></button><button class="nav" data-page="library">▤ <span class="txt">Library</span></button><button class="nav" data-page="fees">₹ <span class="txt">Fee Management</span></button><div class="label">SYSTEM</div><button class="nav" data-page="security">◈ <span class="txt">Security & Backup</span></button></aside><main class="main"><header class="top"><div><h2>Dr. Ambedkar Institute of Technology for Divyangjan, U.P., Kanpur</h2><small>CampusVault · Student, Library & Fee Management</small></div><button class="btn" onclick="location.reload()">Refresh</button></header><div class="content" id="app"></div></main></div><div id="modal"></div><script>
const app=document.getElementById('app'),modal=document.getElementById('modal');let page='dashboard',students=[];const api=async(u,o={})=>{let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Request failed');return x};const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function nav(){document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));render()})}
async function render(){try{if(page==='dashboard')return dashboard();if(page==='students')return studentPage();if(page==='library')return libraryPage();if(page==='fees')return feePage();return securityPage()}catch(e){app.innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
async function dashboard(){let x=await api('/api/dashboard');app.innerHTML=`<div class=head><div><h1>Dashboard</h1><p>Live institutional overview.</p></div></div><div class=grid><div class="card stat"><small>STUDENTS</small><strong>${x.totalStudents}</strong><span class=muted>Enrolled records</span></div><div class="card stat"><small>LIBRARY BOOKS</small><strong>${x.libraryBooks}</strong><span class=muted>${x.issuedBooks} currently issued</span></div><div class="card stat"><small>AVG ATTENDANCE</small><strong>${x.avgAttendance}%</strong><span class=muted>${x.lowAttendanceCount} low-attendance</span></div><div class="card stat"><small>FEES COLLECTED</small><strong>${money(x.feeSummary.paid)}</strong><span class=muted>${money(x.feeSummary.pending)} pending</span></div></div><div class=two><div class=card><div class=section-title><h3>Departmental Distribution</h3></div>${x.departments.map(d=>`<div style="margin:14px 0"><b>${esc(d.department)}</b><span style="float:right">${d.count}</span><div style="height:7px;background:#e8edf3;border-radius:9px;margin-top:6px"><div style="height:100%;width:${Math.min(100,d.count)}%;background:#1769aa;border-radius:9px"></div></div></div>`).join('')}</div><div class=card><div class=section-title><h3>Quick actions</h3></div><p class=muted>Manage books, issue/return records, and student fee ledgers.</p><button class="btn primary" onclick="page='library';render()">Open Library</button> <button class="btn" onclick="page='fees';render()">Open Fees</button></div></div>`}
async function studentPage(){let x=await api('/api/students?perPage=100');students=x.rows;app.innerHTML=`<div class=head><div><h1>Students Directory</h1><p>Student master records used by library and fee modules.</p></div></div><div class=card><div class=filters><input id=ss placeholder="Search name, roll no, email or enrollment ID"><select id=sd><option value="">All departments</option>${(await api('/api/departments')).map(d=>`<option>${esc(d.name)}</option>`).join('')}</select><button class=btn onclick="loadStudentTable()">Search</button></div><div id=st class=table></div></div>`;loadStudentTable()}
async function loadStudentTable(){let q=new URLSearchParams({perPage:100});if(document.getElementById('ss')?.value)q.set('search',document.getElementById('ss').value);if(document.getElementById('sd')?.value)q.set('department',document.getElementById('sd').value);let x=await api('/api/students?'+q);students=x.rows;document.getElementById('st').innerHTML=`<table><thead><tr><th>Name</th><th>Roll No</th><th>Enrollment</th><th>Department</th><th>Year/Sec</th><th>CGPA</th><th>Attendance</th></tr></thead><tbody>${students.map(s=>`<tr><td><b>${esc(s.full_name)}</b><br><span class=muted>${esc(s.email)}</span></td><td>${esc(s.roll_no)}</td><td>${esc(s.enrollment_id)}</td><td>${esc(s.department)}</td><td>Y${s.year} / ${esc(s.section)}</td><td>${s.cgpa}</td><td><span class="pill ${s.attendance<65?'red':'green'}">${s.attendance}%</span></td></tr>`).join('')}</tbody></table>`}
async function libraryPage(){let [b,i]=await Promise.all([api('/api/books'),api('/api/issues')]);app.innerHTML=`<div class=head><div><h1>Library Management</h1><p>Book catalogue, issue/return history, condition and fines.</p></div><button class="btn primary" onclick="issueForm()">+ Issue Book</button></div><div class=grid><div class="card stat"><small>TOTAL TITLES</small><strong>${b.length}</strong></div><div class="card stat"><small>TOTAL COPIES</small><strong>${b.reduce((a,x)=>a+x.total_copies,0)}</strong></div><div class="card stat"><small>AVAILABLE</small><strong>${b.reduce((a,x)=>a+x.available_copies,0)}</strong></div><div class="card stat"><small>ISSUED</small><strong>${i.filter(x=>x.status==='Issued').length}</strong></div></div><div class=two><div class=card><div class=section-title><h3>Book Catalogue</h3></div><div class=table><table><thead><tr><th>Book</th><th>Author</th><th>Category</th><th>Copies</th><th>Shelf</th></tr></thead><tbody>${b.map(x=>`<tr><td><b>${esc(x.title)}</b><br><span class=muted>${x.book_code} · ISBN ${x.isbn||'—'}</span></td><td>${esc(x.author)}</td><td>${esc(x.category||'—')}</td><td>${x.available_copies}/${x.total_copies}</td><td>${esc(x.shelf||'—')}</td></tr>`).join('')}</tbody></table></div></div><div class=card><div class=section-title><h3>Issue / Return Register</h3></div><div class=table><table><thead><tr><th>Student</th><th>Book</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${i.map(x=>`<tr><td>${esc(x.full_name)}<br><span class=muted>${x.roll_no}</span></td><td>${esc(x.title)}</td><td>${x.due_date}</td><td><span class="pill ${x.status==='Issued'?'amber':'green'}">${x.status}</span></td><td>${x.status==='Issued'?`<button class="btn" onclick="returnForm(${x.id})">Return</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan=5 class=empty>No issue records</td></tr>'}</tbody></table></div></div></div>`}
function issueForm(){modal.innerHTML=`<div class=overlay><div class=modal><h2>Issue Library Book</h2><div class=form><div><label>Student</label><select id=ist>${students.length?students.map(s=>`<option value="${s.id}">${esc(s.full_name)} — ${s.roll_no}</option>`).join(''):''}</select></div><div><label>Book</label><select id=ib></select></div><div><label>Issue date</label><input id=idate type=date value="${new Date().toISOString().slice(0,10)}"></div><div><label>Due date</label><input id=ddate type=date value="${new Date(Date.now()+12096e5).toISOString().slice(0,10)}"></div><div><label>Condition</label><select id=ic><option>Good</option><option>Damaged</option></select></div><div class=full><label>Notes</label><input id=inotes placeholder="Optional issue note"></div></div><div class=actions><button class=btn onclick="modal.innerHTML=''">Cancel</button><button class="btn primary" onclick="doIssue()">Issue Book</button></div></div></div>`;api('/api/books').then(b=>document.getElementById('ib').innerHTML=b.map(x=>`<option value="${x.id}">${esc(x.title)} (${x.available_copies} available)</option>`).join(''))}
async function doIssue(){try{await api('/api/issues',{method:'POST',body:JSON.stringify({student_id:+ist.value,book_id:+ib.value,issue_date:idate.value,due_date:ddate.value,issue_condition:ic.value,notes:inotes.value})});modal.innerHTML='';libraryPage()}catch(e){alert(e.message)}}
function returnForm(id){modal.innerHTML=`<div class=overlay><div class=modal><h2>Return Book</h2><div class=form><div><label>Return date</label><input id=rd type=date value="${new Date().toISOString().slice(0,10)}"></div><div><label>Fine (₹)</label><input id=rf type=number min=0 value=0></div><div><label>Return condition</label><select id=rc><option>Good</option><option>Damaged</option><option>Lost</option></select></div></div><div class=actions><button class=btn onclick="modal.innerHTML=''">Cancel</button><button class="btn primary" onclick="doReturn(${id})">Confirm Return</button></div></div></div>`}
async function doReturn(id){try{await api('/api/issues/'+id+'/return',{method:'POST',body:JSON.stringify({return_date:rd.value,fine:+rf.value,return_condition:rc.value})});modal.innerHTML='';libraryPage()}catch(e){alert(e.message)}}
async function feePage(){let [chart,pay,sum,st]=await Promise.all([api('/api/fees/chart'),api('/api/fees/payments'),api('/api/fees/summary'),api('/api/students?perPage=100')]);students=st.rows;app.innerHTML=`<div class=head><div><h1>Fee Management</h1><p>Fee chart first, followed by student-wise payment ledger.</p></div><button class="btn primary" onclick="paymentForm()">+ Record Payment</button></div><div class=notice><b>Fee-chart source note:</b> the seeded figures below are historical reference figures from an AITH 2023-24 admission notice, not a claim about the current 2026-27 fee schedule. Verify and update the chart against the latest institute notice before official use.</div><div class=grid><div class="card stat"><small>TOTAL DUE</small><strong>${money(sum.due)}</strong></div><div class="card stat"><small>COLLECTED</small><strong>${money(sum.paid)}</strong></div><div class="card stat"><small>PENDING</small><strong>${money(sum.pending)}</strong></div><div class="card stat"><small>PAYMENT ENTRIES</small><strong>${sum.payments}</strong></div></div><div class=card style="margin-top:15px"><div class=section-title><h3>1. College Fee Chart</h3></div><div class=table><table><thead><tr><th>Session</th><th>Category</th><th>Fee</th><th>Applicable To</th><th>Amount</th><th>Note</th></tr></thead><tbody>${chart.map(x=>`<tr><td>${x.session}</td><td>${esc(x.category)}</td><td><b>${esc(x.fee_name)}</b></td><td>${esc(x.applicable_to)}</td><td><b>${money(x.amount)}</b></td><td class=muted>${esc(x.notes||'')}</td></tr>`).join('')}</tbody></table></div></div><div class=card style="margin-top:15px"><div class=section-title><h3>2. Student-wise Fee Payment Ledger</h3><input id=fpsearch class="filters" placeholder="Search student / roll / transaction" oninput="filterPayments()"></div><div id=pt class=table>${paymentTable(pay)}</div></div>`}
function paymentTable(p){return `<table><thead><tr><th>Student</th><th>Session/Sem</th><th>Fee</th><th>Due</th><th>Paid</th><th>Date</th><th>Mode</th><th>Transaction Ref</th><th>Status</th><th></th></tr></thead><tbody>${p.map(x=>`<tr><td><b>${esc(x.full_name)}</b><br><span class=muted>${x.roll_no}</span></td><td>${x.session}<br>${x.semester}</td><td>${esc(x.fee_name)}</td><td>${money(x.amount_due)}</td><td>${money(x.amount_paid)}</td><td>${x.payment_date||'—'}</td><td>${esc(x.mode||'—')}</td><td>${esc(x.transaction_ref||'—')}</td><td><span class="pill ${x.status==='Paid'?'green':x.status==='Partial'?'amber':'red'}">${x.status}</span></td><td><button class=btn onclick='printReceipt(${JSON.stringify(x)})'>Receipt</button></td></tr>`).join('')||'<tr><td colspan=10 class=empty>No payments recorded yet</td></tr>'}</tbody></table>`}
async function filterPayments(){let q=encodeURIComponent(document.getElementById('fpsearch').value),p=await api('/api/fees/payments?search='+q);document.getElementById('pt').innerHTML=paymentTable(p)}
function paymentForm(){modal.innerHTML=`<div class=overlay><div class=modal><h2>Record Fee Payment</h2><div class=form><div class=full><label>Student</label><select id=ps>${students.map(s=>`<option value="${s.id}">${esc(s.full_name)} — ${s.roll_no}</option>`).join('')}</select></div><div><label>Session</label><input id=fs value="2026-27"></div><div><label>Semester</label><select id=fsem><option>1st Semester</option><option>2nd Semester</option></select></div><div><label>Fee Name</label><input id=fn value="Institute Fee"></div><div><label>Amount Due</label><input id=fd type=number value=0></div><div><label>Amount Paid</label><input id=fp type=number value=0></div><div><label>Payment Date</label><input id=fdate type=date value="${new Date().toISOString().slice(0,10)}"></div><div><label>Mode</label><select id=fmode><option>Online</option><option>UPI</option><option>Bank Transfer</option><option>Cash</option><option>Demand Draft</option></select></div><div><label>Transaction / Reference ID</label><input id=fr></div><div class=full><label>Remarks</label><input id=fremarks></div></div><div class=actions><button class=btn onclick="modal.innerHTML=''">Cancel</button><button class="btn primary" onclick="doPayment()">Save Payment</button></div></div></div>`}
async function doPayment(){try{await api('/api/fees/payments',{method:'POST',body:JSON.stringify({student_id:+ps.value,session:fs.value,semester:fsem.value,fee_name:fn.value,amount_due:+fd.value,amount_paid:+fp.value,payment_date:fdate.value,mode:fmode.value,transaction_ref:fr.value,remarks:fremarks.value})});modal.innerHTML='';feePage()}catch(e){alert(e.message)}}
function printReceipt(x){let w=window.open('','_blank');w.document.write(`<html><head><title>CampusVault Fee Receipt</title><style>body{font-family:Arial;padding:35px;color:#172b4d}.box{max-width:700px;margin:auto;border:1px solid #ccc;padding:30px}.row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #ddd}</style></head><body><div class=box><h1 style=text-align:center>CampusVault</h1><h2 style=text-align:center>Fee Payment Receipt</h2><p style=text-align:center>Dr. Ambedkar Institute of Technology for Divyangjan, U.P., Kanpur</p>${[['Receipt ID',x.id],['Student',x.full_name],['Roll No',x.roll_no],['Department',x.department],['Session',x.session],['Semester',x.semester],['Fee',x.fee_name],['Amount Due',money(x.amount_due)],['Amount Paid',money(x.amount_paid)],['Payment Date',x.payment_date||''],['Mode',x.mode||''],['Transaction Reference',x.transaction_ref||''],['Status',x.status]].map(r=>`<div class=row><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}<p style="margin-top:30px;color:#666">System-generated CampusVault receipt. Institutional authorization/signature should be added before treating it as an official college receipt.</p><button onclick="print()">Print</button></div></body></html>`);w.document.close()}
function securityPage(){app.innerHTML=`<div class=head><div><h1>Security & Backup</h1><p>Existing CampusVault backup controls.</p></div></div><div class=card><h3>Database</h3><p class=muted>SQLite is used for the current deployment. For production-grade financial/student records, use proper authentication and persistent storage.</p><h3>Backup protection</h3><p class=muted>Backups are protected by the configured security PIN. The default development PIN in the existing database is 1234; change it before real deployment.</p></div>`}
nav();render();
</script></body></html>
